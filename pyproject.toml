[project]
name = "o-qt-mcp-server"
version = "0.3.0"
description = "Specialized MCP workflow engine for the OECD QSAR Toolbox inside the ToxMCP suite"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "O-QT Team", email = "oss@senseibelbi.dev" }
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "fastapi>=0.118.0,<1.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "python-json-logger>=2.0.7,<4.0.0",
    "authlib>=1.6.12,<2.0.0",
    "httpx>=0.28.0,<1.0.0",
    # Transitive-dependency floors pinned to clear known CVEs (see CHANGELOG).
    "cryptography>=48.0.1,<49.0.0",
    "idna>=3.15,<4.0.0",
    "urllib3>=2.7.0,<3.0.0",
    "python-dotenv>=1.2.2,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/ToxMCP/toxmcp"
Repository = "https://github.com/ToxMCP/oqt-mcp"
Documentation = "https://github.com/ToxMCP/oqt-mcp#readme"

[tool.poetry]
package-mode = false

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3,<10.0.0"
requests = "^2.33.0"
black = ">=26.3.1,<27.0.0"
isort = "^5.13.2"
pytest-asyncio = ">=0.24.0,<2.0.0"
jsonschema = "^4.24.0"
pygments = ">=2.20.0,<3.0.0"

[tool.poetry.dependencies]
python = "^3.10"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore:datetime.datetime.utcnow\\(\\) is deprecated"
]
markers = [
    "integration: live QSAR Toolbox calls requiring QSAR_LIVE_TESTS=1",
    "slow: long-running live Toolbox execution/report paths requiring QSAR_LIVE_SLOW_TESTS=1"
]
