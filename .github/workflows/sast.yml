name: Python security checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "31 6 * * 1"

permissions:
  contents: read

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install security scanner
        run: python -m pip install "bandit>=1.9.4,<2.0"
      - name: Check production source
        run: bandit -r src --severity-level medium --confidence-level medium
